    <!-- Apply the saved theme before first paint to avoid a light flash in dark mode. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("malani-theme") || '"system"');
          var dark = p === "dark" || (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
